<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors ligne — StepForIt Ops</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #1f1f1f;
        background: #f5f5f5;
      }
      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: #595959;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        font-size: 0.95rem;
        color: #fff;
        background: #047a76;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="64" height="64" alt="" />
      <h1>Pas de réseau</h1>
      <p>
        La console lit ses données en direct depuis l'API : sans connexion, il n'y a rien à afficher — mieux
        vaut le dire que montrer un état périmé.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
