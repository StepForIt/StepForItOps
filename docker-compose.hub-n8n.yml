# Pack « n8n + StepForIt Ops » depuis Docker Hub : docker-compose.hub.yml à
# l'identique, plus un n8n prêt à brancher. Pour qui n'a pas encore n8n ; qui en
# a un garde docker-compose.hub.yml.
#
#   curl -O https://raw.githubusercontent.com/StepForIt/StepForItOps/dev/docker-compose.hub-n8n.yml
#   docker compose -f docker-compose.hub-n8n.yml up -d
#
# .env à côté : les variables de docker-compose.hub.yml, plus
#   N8N_ENCRYPTION_KEY  chiffre les identifiants stockés par n8n ; ne plus la changer
#   N8N_PUBLIC_URL      adresse où l'on ouvre n8n : http://<hôte>:5678 ou https://n8n.<domaine>
#
# Dans Ops, l'instance n8n s'ajoute avec l'adresse interne http://n8n:5678 (même
# réseau Docker que l'api). n8n garde ses données (base SQLite, comptes, workflows)
# dans le volume n8n_data : `down` puis `up` ne perd rien, `down -v` efface tout.
#
# Tout ce qui suit jusqu'au service n8n est une copie de docker-compose.hub.yml :
# une modification là-bas se reporte ici.
#
# --- En-tête de docker-compose.hub.yml ---
# Installation depuis Docker Hub, sans cloner ni construire : même stack que
# docker-compose.yml, images publiées par .github/workflows/publish-docker.yml.
#
#   curl -O https://raw.githubusercontent.com/StepForIt/StepForItOps/dev/docker-compose.hub.yml
#   docker compose -f docker-compose.hub.yml up -d
#
# NWM_VERSION épingle une version (0.2.0, 0.2, ou 0.2.0-arm64 pour une seule
# archi) ; `latest` par défaut. Garder l'alias réseau de l'api : l'image web
# joint l'API à http://stepforit-ops-api:3001, adresse figée à son build.
# Toute variable ajoutée à docker-compose.yml se reporte ici.
x-api-image: &api-image ${NWM_IMAGE_PREFIX:-mathieum/stepforitops}-api:${NWM_VERSION:-latest}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nwm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-nwm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nwm}']
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: *api-image
    command: ['./apps/api/scripts/migrate.sh']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nwm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nwm}?schema=public
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: *api-image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nwm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nwm}?schema=public
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?API_PUBLIC_URL requis (URL publique de l'API)}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-medium-latest}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GDRIVE_ACCESS_TOKEN: ${GDRIVE_ACCESS_TOKEN:-}
      KUMA_URL: ${KUMA_URL:-}
      KUMA_USERNAME: ${KUMA_USERNAME:-}
      KUMA_PASSWORD: ${KUMA_PASSWORD:-}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?API_ACCESS_TOKEN requis (jeton front → API)}
      # Chiffrement au repos des clés API et comptes n8n (cf. .env.example). Vide : en clair.
      SECRETS_KEY: ${SECRETS_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      default:
        # Le nom que l'image web appelle (API_INTERNAL_URL, figé à son build). Jamais « api » seul : un web
        # sur un réseau partagé (dokploy-network, pour Traefik) y résout aussi l'« api » d'une autre pile.
        aliases:
          - stepforit-ops-api

  web:
    image: ${NWM_IMAGE_PREFIX:-mathieum/stepforitops}-web:${NWM_VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL requis (URL publique du front)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAIN: ${GOOGLE_ALLOWED_DOMAIN:-}
      APP_USERNAME: ${APP_USERNAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:?API_ACCESS_TOKEN requis (jeton front → API)}
    # Seul port publié : à mettre derrière un reverse proxy HTTPS.
    ports:
      - '${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      - api

  # n8n officiel, version figée (jamais `latest` : une montée de version migre sa base).
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.6
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY requis (clé de chiffrement de n8n)}
      N8N_PUBLIC_URL: ${N8N_PUBLIC_URL:?N8N_PUBLIC_URL requis (URL publique de n8n)}
      N8N_PORT: 5678
      # IPv4 : par défaut n8n écoute sur « :: » et meurt sur un hôte sans IPv6.
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: 'true'
    # Dérive de N8N_PUBLIC_URL ce que n8n attend en plusieurs morceaux (compose ne sait
    # pas découper une variable) : WEBHOOK_URL, N8N_EDITOR_BASE_URL, N8N_PROTOCOL,
    # N8N_HOST. En http, le cookie de session n'est pas « Secure », sinon le navigateur
    # le refuse et la connexion échoue hors localhost ; en https, n8n est derrière un
    # reverse proxy (N8N_PROXY_HOPS). Puis l'entrée d'origine de l'image.
    entrypoint:
      - /bin/sh
      - -c
      - |
        url="$${N8N_PUBLIC_URL%/}"
        case "$$url" in
          https://*) export N8N_PROTOCOL=https N8N_SECURE_COOKIE=true N8N_PROXY_HOPS=1 ;;
          http://*) export N8N_PROTOCOL=http N8N_SECURE_COOKIE=false ;;
          *) echo "N8N_PUBLIC_URL doit commencer par http:// ou https:// (reçu : $$N8N_PUBLIC_URL)" >&2; exit 1 ;;
        esac
        hostport="$${url#*://}"
        hostport="$${hostport%%/*}"
        export N8N_HOST="$${hostport%%:*}" WEBHOOK_URL="$$url/" N8N_EDITOR_BASE_URL="$$url/"
        exec tini -- /docker-entrypoint.sh
    # L'éditeur, ouvert sur http://localhost:5678 ; l'api d'Ops, elle, passe par http://n8n:5678.
    ports:
      - '5678:5678'
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  n8n_data:
